<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 · 경기산업 기성집행서</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-card">
        <div class="login-brand">
          <div class="brand-mark">GI</div>
          <div>
            <strong>경기산업</strong>
            <span>기성집행서</span>
          </div>
        </div>

        <form id="loginForm" class="login-form" novalidate>
          <h1>로그인</h1>
          <p class="login-hint">아마란스10 메뉴에서 들어오면 자동으로 로그인됩니다. 직접 접속한 경우 계정을 입력해 주세요.</p>
          <div class="field">
            <label for="loginId">로그인 ID</label>
            <input id="loginId" name="loginId" autocomplete="username" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <p class="login-error" id="loginError" role="alert" hidden></p>
          <button class="button primary login-submit" type="submit" id="loginSubmit">로그인</button>
        </form>

        <form id="passwordForm" class="login-form" hidden novalidate>
          <h1>비밀번호 변경</h1>
          <p class="login-hint">임시 비밀번호를 사용 중입니다. 새 비밀번호를 정한 뒤 계속 진행해 주세요.</p>
          <div class="field">
            <label for="currentPassword">현재 비밀번호</label>
            <input id="currentPassword" type="password" autocomplete="current-password" required>
          </div>
          <div class="field">
            <label for="newPassword">새 비밀번호</label>
            <input id="newPassword" type="password" autocomplete="new-password" required>
            <small>10자 이상, 영문 · 숫자 · 기호 중 두 종류 이상</small>
          </div>
          <div class="field">
            <label for="confirmPassword">새 비밀번호 확인</label>
            <input id="confirmPassword" type="password" autocomplete="new-password" required>
          </div>
          <p class="login-error" id="passwordError" role="alert" hidden></p>
          <button class="button primary login-submit" type="submit" id="passwordSubmit">변경하고 시작하기</button>
        </form>

        <p class="login-footer">사내 전용 시스템입니다. 접속 기록이 남습니다.</p>
      </section>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
